<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Alwine Vertrieb</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Alwine <span>Vertrieb</span></div>
    <button class="iconbtn" id="btn-settings" aria-label="Einstellungen">⚙︎</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/heute" data-route="heute"><span class="ico">📈</span>Heute</a>
    <a href="#/leads" data-route="leads"><span class="ico">🏢</span>Leads</a>
    <a href="#/anruf" data-route="anruf" class="primary"><span class="ico">📞</span>Anrufen</a>
    <a href="#/finden" data-route="finden"><span class="ico">🔍</span>Finden</a>
    <a href="#/vorlagen" data-route="vorlagen"><span class="ico">💬</span>Vorlagen</a>
    <a href="#/wissen" data-route="wissen"><span class="ico">📚</span>Wissen</a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/sync.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/data/industries.js"></script>
  <script src="js/data/scripts.js"></script>
  <script src="js/data/emails.js"></script>
  <script src="js/data/scripts_en.js"></script>
  <script src="js/data/emails_en.js"></script>
  <script src="js/data/lead_sources.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
