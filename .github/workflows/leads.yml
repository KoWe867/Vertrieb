name: Automatische Lead-Suche

on:
  schedule:
    - cron: "30 3 * * 1-5"   # Mo–Fr 03:30 UTC (05:30 deutscher Sommerzeit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leads suchen
        run: python3 scripts/fetch_leads.py
      - name: Ergebnis committen
        run: |
          git config user.name "alwine-lead-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leads-auto.json data/leads-seen.json
          git diff --cached --quiet || git commit -m "Automatische Leads $(date -u +%F)"
          git push
